server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /attendee {
        return 308 /attendee/;
    }

    location /attendee/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /attendee/ {
        try_files $uri $uri/ /attendee/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
